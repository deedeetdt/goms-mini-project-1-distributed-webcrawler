[package]
name = "distributed_crawler"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "crawl"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "charset"] }
scraper = "0.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["net", "io-util", "time"] }
